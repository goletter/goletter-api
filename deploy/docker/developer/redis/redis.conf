# Redis：业务缓存与锁。队列已迁到 RabbitMQ，不要把队列数据放进来。
# 密码必须与 deploy/docker/docker-compose.yml 的 REDIS_AUTH 一致。
# 容器内不要改成 daemonize yes，否则 Docker 会认为进程已经退出。

bind 0.0.0.0
protected-mode yes
port 6379
tcp-backlog 511
# 0 = 不踢空闲连接。应用用连接池，Redis 主动断开后池里的连接会失效。
timeout 0
tcp-keepalive 300

daemonize no
supervised no
loglevel notice
# 空字符串：日志打到标准输出，docker logs 能看到。
logfile ""
databases 16
always-show-logo no

# 快照。dir 必须落在数据卷上，容器重建后数据还在。
save 3600 1
save 300 100
save 60 10000
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
rdb-save-incremental-fsync yes
dir /data

# AOF。everysec 在断电时最多丢约 1 秒，用来保住锁和短期状态。
appendonly yes
appendfilename "appendonly.aof"
appenddirname "appendonlydir"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb
aof-load-truncated yes
aof-use-rdb-preamble yes
aof-rewrite-incremental-fsync yes

# 与 compose 的 REDIS_AUTH、本地 .env 的 REDIS_AUTH 相同。
requirepass 123456

maxclients 10000

# 满了就拒绝写入。allkeys-lru 会把还没过期的锁悄悄删掉。
maxmemory 512mb
maxmemory-policy noeviction
maxmemory-samples 5

lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes
replica-lazy-flush yes
lazyfree-lazy-user-del yes
lazyfree-lazy-user-flush yes

# 超过 10ms 的命令进慢日志。
slowlog-log-slower-than 10000
slowlog-max-len 128
latency-monitor-threshold 100

# DEBUG / MODULE 关掉。CONFIG 只允许容器本机（健康检查、排障）。
enable-debug-command no
enable-module-command no
enable-protected-configs local

activerehashing yes
hz 10
dynamic-hz yes
jemalloc-bg-thread yes
