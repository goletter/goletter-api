upstream goletter_backend {
    # 同 Docker 网络内用容器名:容器端口；失败 1 次后 5 秒内不再转发
    server app_a:8501 max_fails=1 fail_timeout=5s;
    server app_b:8501 max_fails=1 fail_timeout=5s;
}

server {
    listen 80;
    listen 443 ssl;
    server_name docs.goletter.cn;
    root /var/www/public;

    index index.html index.htm;
    client_max_body_size 1000m;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # mTLS（按需开启）
    # ssl_client_certificate /var/www/cert/mtls/ca/ca.crt;
    # ssl_verify_client optional;
    # ssl_verify_depth 2;

    ssl_certificate     /var/www/cert/docs.goletter.cn.pem;
    ssl_certificate_key /var/www/cert/docs.goletter.cn.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers EECDH+CHACHA20:EECDH+AES128:RSA+AES128:EECDH+AES256:RSA+AES256:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    location ~ ^/api/ {
        proxy_pass http://goletter_backend;

        # A/B 重启时瞬时失败自动切到另一节点
        proxy_next_upstream error timeout invalid_header http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        proxy_next_upstream_timeout 5s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # proxy_set_header X-SSL-Client-Verify $ssl_client_verify;
        # proxy_set_header X-SSL-Client-DN $ssl_client_s_dn;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    location ~ /\.ht {
        deny all;
    }
}
