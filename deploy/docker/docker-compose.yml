name: goletter-cluster

x-app: &app
  image: goletter-app:latest
  build:
    context: ../..
  extra_hosts:
    - 'host.docker.internal:host-gateway'
  environment:
    APP_ENV: dev
    SCAN_CACHEABLE: 'false'
    APP_PORT: '8501'
  networks:
    - app_network
  restart: always
  stop_signal: SIGINT
  stop_grace_period: 20s
  healthcheck:
    test: ['CMD', 'nc', '-z', '127.0.0.1', '8501']
    interval: 3s
    timeout: 2s
    retries: 3
    start_period: 5s

services:
  app_a:
    <<: *app
    container_name: app_a
    ports:
      - '8501:8501'
    volumes:
      - ../..:/opt/www
      - /opt/www/vendor
      - /opt/www/runtime
      - ../../runtime/app_a/logs:/opt/www/runtime/logs

  app_b:
    <<: *app
    container_name: app_b
    ports:
      - '8502:8501'
    volumes:
      - ../..:/opt/www
      - /opt/www/vendor
      - /opt/www/runtime
      - ../../runtime/app_b/logs:/opt/www/runtime/logs

  nginx:
    image: nginx:latest
    container_name: nginx
    volumes:
      - ../..:/var/www
      - ./nginx.conf:/etc/nginx/conf.d/nginx.conf:ro
      - ../../cert:/var/www/cert:ro
    ports:
      - '80:80'
      - '443:443'
    networks:
      - app_network
    restart: always
    depends_on:
      - app_a
      - app_b

networks:
  app_network:
    driver: bridge
