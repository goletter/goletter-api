upstream wewall_backend {
    # 💡 Nginx 在同一个 Docker 网络中，直接通过“容器名:容器内端口(9501)”进行互访
    # max_fails=1 fail_timeout=5s 意味着只要失败 1 次，接下来的 5 秒内流量就不会再发给它
    server app_a:9501 max_fails=1 fail_timeout=5s;
    server app_b:9501 max_fails=1 fail_timeout=5s;
}

server {
    listen 80;
    listen 443 ssl;
    server_name test.goletter.cn;
    root /var/www/public;

    index index.html index.htm;
    client_max_body_size 1000m;

    location /wewall/ {
        try_files $uri $uri/ /wewall/index.html;
    }

    location /admin/ {
        try_files $uri $uri/ /admin/index.html;
    }

    # 客户端证书：用我们自己的 CA 校验
    ssl_client_certificate /var/www/cert/mtls/ca/ca.crt;
    ssl_verify_client off;

    ssl_certificate    /var/www/cert/server/test.goletter.cn.pem;
    ssl_certificate_key   /var/www/cert/server/test.goletter.cn.key;
    ssl_protocols TLSv1.1 TLSv1.2 TLSv1.3;
    ssl_ciphers EECDH+CHACHA20:EECDH+CHACHA20-draft:EECDH+AES128:RSA+AES128:EECDH+AES256:RSA+AES256:EECDH+3DES:RSA+3DES:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # API 转发的核心
    location ~ ^/api/ {
        proxy_pass http://wewall_backend;

        # 💡【无缝切换核心】全量拦截：网络连接错误、超时、502/503/504
        # 一旦 A 节点在重启或瞬间断开，Nginx 会在 0 毫秒内自动把当前请求转发给 B 节点
        proxy_next_upstream error timeout invalid_header http_502 http_503 http_504;

        # 限制重试次数：最多重试 2 次（防止无限循环）
        proxy_next_upstream_tries 2;
        proxy_next_upstream_timeout 5s;

        # 保持标准的代理 Header
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_set_header X-SSL-Client-Verify $ssl_client_verify;
        proxy_set_header X-SSL-Client-DN $ssl_client_s_dn;
        proxy_set_header X-SSL-Client-Serial $ssl_client_serial;
        proxy_set_header X-SSL-Client-Fingerprint $ssl_client_fingerprint;

        # 💡 常驻内存框架长连接优化 (Swoole/Hyperf 强烈建议开启)
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    location ~ /\.ht {
        deny all;
    }
}